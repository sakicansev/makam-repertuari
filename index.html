<style>
  :root{
    --bg:#17130f; --panel:#201a13; --panel-2:#29221a; --panel-3:#332a1f;
    --border:rgba(201,162,75,0.16); --border-strong:rgba(201,162,75,0.34);
    --gold:#c9a24b; --gold-dim:#8f7439; --gold-bright:#e0bd6c;
    --teal:#6fb3a2; --teal-bg:#20342f; --teal-border:#3c7d6e;
    --ink:#efe7d4; --ink-dim:#b7ac93; --ink-faint:#847a63;
    --danger:#c96a56; --danger-bg:#3a221c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
  }
  .ui{font-family:'Inter',sans-serif;}
  .app{max-width:1080px; margin:0 auto; padding:2.5rem 1.5rem 4rem;}

  header.top{text-align:center; margin-bottom:1.75rem;}
  header.top h1{
    font-size:2.4rem; font-weight:500; letter-spacing:0.02em; margin:0 0 0.35rem;
    color:var(--gold-bright);
  }
  header.top .subtitle{
    margin:0; color:var(--ink-dim); font-size:1.05rem; font-style:italic;
  }
  .ornament{margin:1.4rem auto 0; max-width:420px;}
  .ornament svg{display:block; width:100%; height:22px;}

  .toolbar{
    display:flex; gap:0.75rem; align-items:center; margin:2rem 0 1.75rem;
    flex-wrap:wrap;
  }
  #search{
    flex:1; min-width:220px; background:var(--panel); border:0.5px solid var(--border-strong);
    color:var(--ink); padding:0.65rem 0.9rem; border-radius:6px; font-size:0.95rem;
    font-family:'Inter',sans-serif;
  }
  #search:focus{outline:none; border-color:var(--gold);}
  #search::placeholder{color:var(--ink-faint);}

  button{font-family:'Inter',sans-serif; cursor:pointer; border-radius:6px; font-size:0.88rem;}
  .btn-primary{
    background:var(--gold); color:#1c1509; border:none; padding:0.65rem 1.1rem;
    font-weight:600; white-space:nowrap;
  }
  .btn-primary:hover{background:var(--gold-bright);}
  .btn-ghost{
    background:transparent; color:var(--ink-dim); border:0.5px solid var(--border-strong);
    padding:0.6rem 1rem;
  }
  .btn-ghost:hover{border-color:var(--gold); color:var(--ink);}
  .btn-danger{
    background:transparent; color:var(--danger); border:0.5px solid var(--danger);
    padding:0.6rem 1rem; margin-right:auto;
  }
  .btn-danger:hover{background:var(--danger-bg);}

  .layout{display:flex; gap:2rem; align-items:flex-start;}
  .sidebar{
    width:200px; flex-shrink:0; display:flex; flex-direction:column; gap:2px;
    position:sticky; top:1.5rem;
  }
  .side-item{
    font-family:'Inter',sans-serif; display:flex; justify-content:space-between; align-items:center;
    padding:0.5rem 0.75rem; border-radius:6px; color:var(--ink-dim); font-size:0.88rem;
    cursor:pointer; border-left:2px solid transparent;
  }
  .side-item:hover{background:var(--panel); color:var(--ink);}
  .side-item.active{
    background:var(--panel-2); color:var(--gold-bright); border-left:2px solid var(--gold);
  }
  .side-item .count{
    font-size:0.76rem; color:var(--ink-faint); background:var(--panel-3);
    padding:0.1rem 0.45rem; border-radius:10px;
  }
  .side-item.active .count{color:var(--gold-dim);}

  .content{flex:1; min-width:0;}
  .group-heading{
    font-size:1.3rem; font-weight:500; color:var(--gold-bright); margin:2rem 0 0.9rem;
    padding-bottom:0.4rem; border-bottom:0.5px solid var(--border);
  }
  .group-heading:first-child{margin-top:0;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:0.9rem;
    margin-bottom:0.5rem;
  }
  .card{
    background:var(--panel); border:0.5px solid var(--border); border-radius:10px;
    padding:1rem 1.1rem; cursor:pointer; transition:border-color 0.15s;
  }
  .card:hover{border-color:var(--border-strong);}
  .card .eser-name{
    font-size:1.15rem; font-weight:500; color:var(--ink); margin:0 0 0.4rem; line-height:1.3;
  }
  .badge{
    font-family:'Inter',sans-serif; display:inline-block; font-size:0.72rem; font-weight:500;
    color:var(--teal); background:var(--teal-bg); border:0.5px solid var(--teal-border);
    padding:0.15rem 0.55rem; border-radius:10px; margin-bottom:0.55rem;
  }
  .card .bestekar{
    font-family:'Inter',sans-serif; font-size:0.82rem; color:var(--ink-dim); margin:0 0 0.5rem;
  }
  .card .link-row a{
    font-family:'Inter',sans-serif; font-size:0.78rem; color:var(--gold-dim);
    text-decoration:none; border-bottom:0.5px dotted var(--gold-dim);
  }
  .card .link-row a:hover{color:var(--gold);}

  .empty{
    text-align:center; padding:3rem 1rem; color:var(--ink-faint); font-size:1.05rem; font-style:italic;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,8,5,0.72); display:flex;
    align-items:center; justify-content:center; z-index:50; padding:1rem;
  }
  .modal{
    background:var(--panel-2); border:0.5px solid var(--border-strong); border-radius:12px;
    padding:1.6rem 1.7rem; width:100%; max-width:400px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{
    font-family:'Inter',sans-serif; font-size:1.05rem; font-weight:600; color:var(--gold-bright);
    margin:0 0 1.1rem;
  }
  .modal label{
    font-family:'Inter',sans-serif; display:block; font-size:0.8rem; color:var(--ink-dim);
    margin-bottom:0.9rem;
  }
  .modal input{
    display:block; width:100%; margin-top:0.35rem; background:var(--panel); color:var(--ink);
    border:0.5px solid var(--border-strong); border-radius:6px; padding:0.55rem 0.7rem;
    font-family:'Inter',sans-serif; font-size:0.88rem;
  }
  .modal input:focus{outline:none; border-color:var(--gold);}
  .form-error{
    font-family:'Inter',sans-serif; color:var(--danger); font-size:0.8rem; margin:-0.4rem 0 0.9rem;
  }
  .modal-actions{display:flex; gap:0.6rem; margin-top:0.4rem;}

  @media (max-width:640px){
    .layout{flex-direction:column;}
    .sidebar{
      width:100%; flex-direction:row; flex-wrap:wrap; position:static; gap:6px;
    }
    .side-item{border-left:none; border-bottom:2px solid transparent;}
    .side-item.active{border-left:none; border-bottom:2px solid var(--gold);}
  }
</style>
</head>

function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : [];
  }catch(e){
    data = [];
  }
  if(!data || data.length === 0){
    data = seed.map(d => ({...d, id: uid()}));
    await saveData();
  }
  render();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    console.error('Kaydetme hatası:', e);
    return false;
  }
}

async function persistChange(mutateFn){
  const backup = JSON.parse(JSON.stringify(data));
  mutateFn();
  const ok = await saveData();
  if(!ok){ data = backup; }
  return ok;
}

function trSort(a,b){ return a.localeCompare(b,'tr'); }

function getMakamlar(){
  const set = new Set(data.map(d => d.makam).filter(Boolean));
  return Array.from(set).sort(trSort);
}

function filteredData(){
  let items = data;
  if(currentMakam !== 'all'){
    items = items.filter(d => d.makam === currentMakam);
  }
  if(searchText.trim()){
    const q = searchText.trim().toLocaleLowerCase('tr');
    items = items.filter(d =>
      (d.eser||'').toLocaleLowerCase('tr').includes(q) ||
      (d.bestekar||'').toLocaleLowerCase('tr').includes(q) ||
      (d.makam||'').toLocaleLowerCase('tr').includes(q) ||
      (d.tur||'').toLocaleLowerCase('tr').includes(q)
    );
  }
  return items;
}

function renderSidebar(){
  const sidebar = document.getElementById('sidebar');
  const makamlar = getMakamlar();
  let html = `<div class="side-item ${currentMakam==='all'?'active':''}" data-makam="all">
    <span>Tümü</span><span class="count">${data.length}</span></div>`;
  makamlar.forEach(m => {
    const count = data.filter(d => d.makam === m).length;
    html += `<div class="side-item ${currentMakam===m?'active':''}" data-makam="${escapeAttr(m)}">
      <span>${escapeHtml(m)}</span><span class="count">${count}</span></div>`;
  });
  sidebar.innerHTML = html;
  sidebar.querySelectorAll('.side-item').forEach(el => {
    el.addEventListener('click', () => {
      currentMakam = el.getAttribute('data-makam');
      render();
    });
  });
}

function cardHtml(item){
  const linkRow = item.link
    ? `<div class="link-row"><a href="${escapeAttr(item.link)}" target="_blank" rel="noopener">Notaya git ↗</a></div>`
    : '';
  return `<div class="card" data-id="${item.id}">
      ${item.tur ? `<span class="badge">${escapeHtml(item.tur)}</span>` : ''}
      <p class="eser-name">${escapeHtml(item.eser || 'İsimsiz eser')}</p>
      ${item.bestekar ? `<p class="bestekar">${escapeHtml(item.bestekar)}</p>` : ''}
      ${linkRow}
    </div>`;
}

function renderContent(){
  const content = document.getElementById('content');
  const items = filteredData();

  if(items.length === 0){
    content.innerHTML = `<div class="empty">Aradığın kritere uyan eser bulunamadı.</div>`;
    return;
  }

  let html = '';
  if(currentMakam === 'all'){
    const makamlar = Array.from(new Set(items.map(d => d.makam))).sort(trSort);
    makamlar.forEach(m => {
      const group = items.filter(d => d.makam === m);
      html += `<h2 class="group-heading">${escapeHtml(m)}</h2><div class="grid">`;
      group.forEach(item => html += cardHtml(item));
      html += `</div>`;
    });
  } else {
    html += `<h2 class="group-heading">${escapeHtml(currentMakam)}</h2><div class="grid">`;
    items.forEach(item => html += cardHtml(item));
    html += `</div>`;
  }
  content.innerHTML = html;

  content.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openModal(el.getAttribute('data-id')));
  });
}

function render(){
  renderSidebar();
  renderContent();
  renderMakamDatalist();
}

function renderMakamDatalist(){
  const dl = document.getElementById('makamList');
  dl.innerHTML = getMakamlar().map(m => `<option value="${escapeAttr(m)}"></option>`).join('');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

function openModal(id){
  editingId = id || null;
  const form = document.getElementById('eserForm');
  form.reset();
  document.getElementById('formError').style.display = 'none';
  if(id){
    const item = data.find(d => d.id === id);
    document.getElementById('modalTitle').textContent = 'Eseri düzenle';
    document.getElementById('f-eser').value = item.eser || '';
    document.getElementById('f-tur').value = item.tur || '';
    document.getElementById('f-makam').value = item.makam || '';
    document.getElementById('f-bestekar').value = item.bestekar || '';
    document.getElementById('f-link').value = item.link || '';
    document.getElementById('deleteBtn').style.display = 'inline-block';
  } else {
    document.getElementById('modalTitle').textContent = 'Yeni eser ekle';
    document.getElementById('deleteBtn').style.display = 'none';
    if(currentMakam !== 'all'){
      document.getElementById('f-makam').value = currentMakam;
    }
  }
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal(){
  document.getElementById('modalOverlay').style.display = 'none';
  editingId = null;
}

document.getElementById('addBtn').addEventListener('click', () => openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'modalOverlay') closeModal();
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if(!editingId) return;
  const delBtn = document.getElementById('deleteBtn');
  const idToDelete = editingId;
  delBtn.textContent = 'Siliniyor...';
  delBtn.disabled = true;
  const ok = await persistChange(() => {
    data = data.filter(d => d.id !== idToDelete);
  });
  delBtn.textContent = 'Sil';
  delBtn.disabled = false;
  if(ok){
    closeModal();
    render();
  } else {
    const errorEl = document.getElementById('formError');
    errorEl.textContent = 'Silinemedi, bağlantı sorunu olabilir. Lütfen tekrar dene.';
    errorEl.style.display = 'block';
  }
});

document.getElementById('eserForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const eser = document.getElementById('f-eser').value.trim();
  const makam = document.getElementById('f-makam').value.trim();
  const errorEl = document.getElementById('formError');
  if(!eser || !makam){
    errorEl.textContent = 'Eser adı ve makam alanları zorunlu.';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';

  const payload = {
    eser,
    makam,
    tur: document.getElementById('f-tur').value.trim(),
    bestekar: document.getElementById('f-bestekar').value.trim(),
    link: document.getElementById('f-link').value.trim()
  };

  const submitBtn = e.target.querySelector('button[type="submit"]');
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = 'Kaydediliyor...';
  submitBtn.disabled = true;

  const ok = await persistChange(() => {
    if(editingId){
      const idx = data.findIndex(d => d.id === editingId);
      data[idx] = {...data[idx], ...payload};
    } else {
      data.push({...payload, id: uid()});
    }
  });

  submitBtn.textContent = originalLabel;
  submitBtn.disabled = false;

  if(ok){
    closeModal();
    render();
  } else {
    errorEl.textContent = 'Kaydedilemedi (bağlantı sorunu olabilir). Lütfen "Kaydet"e tekrar bas.';
    errorEl.style.display = 'block';
  }
});

document.getElementById('search').addEventListener('input', (e) => {
  searchText = e.target.value;
  renderContent();
});

loadData();
</script>
<div class="modal-overlay" id="backupOverlay" style="display:none;">
  <div class="modal">
    <h2>Yedekle / Geri Yükle</h2>
    <label class="ui" style="display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:0.4rem;">
      Mevcut listen (kopyalayıp bir yere sakla):
    </label>
    <textarea id="backupExport" class="ui" readonly
      style="width:100%; height:110px; background:var(--panel); color:var(--ink); border:0.5px solid var(--border-strong); border-radius:6px; padding:0.6rem; font-size:0.75rem; margin-bottom:0.5rem;"></textarea>
    <button type="button" class="btn-ghost" id="copyBackupBtn" style="width:100%; margin-bottom:1.1rem;">Panoya Kopyala</button>

    <label class="ui" style="display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:0.4rem;">
      Geri yüklemek için buraya yapıştır (mevcut listenin üzerine yazar):
    </label>
    <textarea id="backupImport" class="ui" placeholder="Buraya yedek metnini yapıştır..."
      style="width:100%; height:90px; background:var(--panel); color:var(--ink); border:0.5px solid var(--border-strong); border-radius:6px; padding:0.6rem; font-size:0.75rem; margin-bottom:0.5rem;"></textarea>
    <div class="form-error" id="backupError" style="display:none;"></div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="closeBackupBtn">Kapat</button>
      <button type="button" class="btn-primary" id="importBackupBtn">İçe Aktar</button>
    </div>
  </div>
</div>

<script>
document.getElementById('backupBtn').addEventListener('click', () => {
  document.getElementById('backupExport').value = JSON.stringify(data, null, 2);
  document.getElementById('backupImport').value = '';
  document.getElementById('backupError').style.display = 'none';
  document.getElementById('backupOverlay').style.display = 'flex';
});
document.getElementById('closeBackupBtn').addEventListener('click', () => {
  document.getElementById('backupOverlay').style.display = 'none';
});
document.getElementById('backupOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'backupOverlay') document.getElementById('backupOverlay').style.display = 'none';
});
document.getElementById('copyBackupBtn').addEventListener('click', async () => {
  const ta = document.getElementById('backupExport');
  ta.select();
  try{
    await navigator.clipboard.writeText(ta.value);
    const btn = document.getElementById('copyBackupBtn');
    const old = btn.textContent;
    btn.textContent = 'Kopyalandı ✓';
    setTimeout(() => btn.textContent = old, 1500);
  }catch(e){
    document.execCommand('copy');
  }
});
document.getElementById('importBackupBtn').addEventListener('click', async () => {
  const raw = document.getElementById('backupImport').value.trim();
  const errEl = document.getElementById('backupError');
  if(!raw){ return; }
  let parsed;
  try{
    parsed = JSON.parse(raw);
    if(!Array.isArray(parsed)) throw new Error('not array');
  }catch(e){
    errEl.textContent = 'Geçersiz format. Yedek metnini olduğu gibi yapıştırdığından emin ol.';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('importBackupBtn');
  btn.textContent = 'Yükleniyor...';
  btn.disabled = true;
  const ok = await persistChange(() => { data = parsed.map(d => ({...d, id: d.id || uid()})); });
  btn.textContent = 'İçe Aktar';
  btn.disabled = false;
  if(ok){
    document.getElementById('backupOverlay').style.display = 'none';
    render();
  } else {
    errEl.textContent = 'Kaydedilemedi, bağlantı sorunu olabilir. Tekrar dene.';
    errEl.style.display = 'block';
  }
});
</script>
